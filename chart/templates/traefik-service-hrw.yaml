{{- if and .Values.gateway.enabled .Values.traefik.highestRandomWeight.enabled -}}
apiVersion: traefik.io/v1alpha1
kind: TraefikService
metadata:
  name: {{ include "rawdb.fullname" . }}-hrw
  labels: {{- include "rawdb.labels" . | nindent 4 }}
spec:
  highestRandomWeight:
    services:
      - name: {{ include "rawdb.fullname" . }}
        port: {{ .Values.service.port }}
        {{- with .Values.traefik.highestRandomWeight.weight }}
        weight: {{ . }}
        {{- end }}
{{- end }}
