{{- if .Values.events.enabled -}}
# Namespace-scoped permission for rawdb to publish Kubernetes Events.
# `create` for new events; `patch` so kube-rs's Recorder can merge
# repeated events (it deduplicates the standard "first/last seen, count"
# triplet via PATCH rather than spamming N rows for identical reasons).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "rawdb.fullname" . }}-events
  labels: {{- include "rawdb.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "rawdb.fullname" . }}-events
  labels: {{- include "rawdb.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "rawdb.fullname" . }}-events
subjects:
  - kind: ServiceAccount
    name: {{ include "rawdb.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end -}}
