{{- if and .Values.secret.create (not .Values.secret.existingSecret) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rawdb.fullname" . }}
  labels: {{- include "rawdb.labels" . | nindent 4 }}
  annotations:
    # Helm doesn't recreate Secrets on every upgrade unless content changes;
    # this annotation makes the rollout pick up Secret edits via checksum
    # on the Deployment (see deployment.yaml).
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{- with .Values.secret.data.s3AccessKey }}
  RAWDB_S3_ACCESS_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secret.data.s3SecretKey }}
  RAWDB_S3_SECRET_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secret.data.adminPasswordHash }}
  RAWDB_ADMIN_PASSWORD_HASH: {{ . | quote }}
  {{- end }}
  {{- if and (not .Values.secret.data.adminPasswordHash) .Values.secret.data.adminPassword }}
  RAWDB_ADMIN_PASSWORD: {{ .Values.secret.data.adminPassword | quote }}
  {{- end }}
  {{- with .Values.secret.data.sessionKey }}
  RAWDB_SESSION_KEY: {{ . | quote }}
  {{- end }}
  {{- if and .Values.config.oidc.enabled .Values.secret.data.oidcClientSecret }}
  RAWDB_OIDC_CLIENT_SECRET: {{ .Values.secret.data.oidcClientSecret | quote }}
  {{- end }}
{{- end -}}
