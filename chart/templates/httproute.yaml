{{- if .Values.gateway.enabled -}}
{{- $mwNames := include "rawdb.traefikMiddlewareNames" . | fromJsonArray -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "rawdb.fullname" . }}
  labels: {{- include "rawdb.labels" . | nindent 4 }}
  {{- with .Values.gateway.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- range .Values.gateway.parentRefs }}
    - name: {{ required "gateway.parentRefs[].name is required when gateway.enabled" .name | quote }}
      {{- with .namespace }}
      namespace: {{ . | quote }}
      {{- end }}
      {{- with .sectionName }}
      sectionName: {{ . | quote }}
      {{- end }}
      {{- with .port }}
      port: {{ . }}
      {{- end }}
    {{- end }}
  {{- with .Values.gateway.hostnames }}
  hostnames:
    {{- range . }}
    - {{ . | quote }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.gateway.rules }}
    - matches: {{- toYaml .matches | nindent 8 }}
      filters:
        {{- with .filters }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- range $mwNames }}
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: {{ . | quote }}
        {{- end }}
      backendRefs:
        {{- if $.Values.traefik.highestRandomWeight.enabled }}
        # HRW mode: route through a TraefikService that wraps the Service
        # with a `highestRandomWeight` load-balancing spec. No `port` here —
        # the port lives inside the TraefikService.
        - group: traefik.io
          kind: TraefikService
          name: {{ include "rawdb.fullname" $ }}-hrw
        {{- else }}
        - group: ""
          kind: Service
          name: {{ include "rawdb.fullname" $ }}
          port: {{ $.Values.service.port }}
        {{- end }}
    {{- end }}
{{- end }}
