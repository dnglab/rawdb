apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rawdb.fullname" . }}
  labels: {{- include "rawdb.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels: {{- include "rawdb.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rawdb.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # Force a rollout when the ConfigMap or rendered Secret changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if and .Values.secret.create (not .Values.secret.existingSecret) }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "rawdb.serviceAccountName" . }}
      # When `events.enabled`, rawdb publishes Kubernetes Events via the
      # API server and therefore needs its SA token mounted, regardless
      # of the `serviceAccount.automountServiceAccountToken` default.
      automountServiceAccountToken: {{ or .Values.events.enabled .Values.serviceAccount.automountServiceAccountToken }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- if semverCompare ">=1.36.0-0" .Capabilities.KubeVersion.GitVersion }}
      # User namespaces (KEP-127). Stable as of Kubernetes 1.36, where
      # the UserNamespacesSupport feature gate is on by default. Setting
      # `hostUsers: false` runs the pod in its own UID namespace so the
      # in-container UID 65532 (runAsUser) maps to an unprivileged UID
      # on the host — a defense-in-depth boundary that limits the blast
      # radius of a container escape. Skipped on older clusters so we
      # don't render a field the API server will reject.
      hostUsers: false
      {{- end }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: rawdb
          image: {{ include "rawdb.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "rawdb.fullname" . }}
            - secretRef:
                name: {{ include "rawdb.secretName" . }}
            {{- with .Values.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # Downward API: POD_NAME / POD_NAMESPACE are read by the
          # k8s Event recorder so emitted events name this specific
          # pod as the involvedObject. Outside a cluster the recorder
          # no-ops when these are absent.
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe: {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe: {{- toYaml .Values.readinessProbe | nindent 12 }}
          {{- if .Values.startupProbe.enabled }}
          startupProbe:
            {{- omit .Values.startupProbe "enabled" | toYaml | nindent 12 }}
          {{- end }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: cache
              mountPath: {{ .Values.config.cacheDir | quote }}
            # readOnlyRootFilesystem=true denies writes anywhere else, so
            # give the process a small writable /tmp scratch area for any
            # ad-hoc tmpfile use (logs, multipart staging, etc.).
            - name: tmp
              mountPath: /tmp
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: cache
          {{- toYaml .Values.cacheVolume | nindent 10 }}
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints: {{- toYaml . | nindent 8 }}
      {{- end }}
