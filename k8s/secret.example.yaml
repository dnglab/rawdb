# Template — DO NOT COMMIT REAL CREDENTIALS.
# Copy to secret.yaml, replace the placeholders, and `kubectl apply` it
# alongside (but not into) git.
apiVersion: v1
kind: Secret
metadata:
  name: rawdb-secret
  namespace: rawdb
type: Opaque
stringData:
  RAWDB_S3_BUCKET: "rawdb"
  RAWDB_S3_ENDPOINT: "https://garage.example.internal"
  RAWDB_S3_ACCESS_KEY: "REPLACE_ME"
  RAWDB_S3_SECRET_KEY: "REPLACE_ME"
  # Bootstrap admin. Strongly prefer the argon2 hash variant in prod.
  # Generate with: cargo run --bin rawdb-hash-password -- 'plaintext'
  # (or any argon2 utility). Comment whichever you don't use.
  RAWDB_ADMIN_PASSWORD: "REPLACE_ME"
  # RAWDB_ADMIN_PASSWORD_HASH: "$argon2id$..."
  # 32+ bytes hex/base64. `openssl rand -hex 32` is fine.
  RAWDB_SESSION_KEY: "REPLACE_ME_32_BYTES_HEX_OR_LONGER"
  # OIDC (optional). All four must be set together, or none.
  # RAWDB_OIDC_ISSUER_URL: "https://github.com"
  # RAWDB_OIDC_CLIENT_ID: "Iv1.xxxxxxxxxxxxxxxx"
  # RAWDB_OIDC_CLIENT_SECRET: "REPLACE_ME"
  # RAWDB_OIDC_REDIRECT_URL: "https://rawdb.example.com/auth/oidc/callback"
